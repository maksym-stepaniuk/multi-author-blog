<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${post.title}">Post</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <a class="btn btn-link px-0 mb-3" href="/">Back</a>

  <h1 class="mb-2" th:text="${post.title}"></h1>

  <div class="text-secondary mb-1">
    <span>Authors: </span>
    <span th:each="a,iter : ${post.authors}" th:text="${a.username()} + (iter.last ? '' : ', ')"></span>
  </div>

  <div class="text-secondary mb-3">
    <span>Avg rating: </span>
    <span th:text="${post.averageRating != null ? #numbers.formatDecimal(post.averageRating, 1, 2) : '-'}"></span>
  </div>

  <div class="card mb-4">
    <div class="card-body">
      <div th:utext="${post.content}"></div>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Rate post</h5>

          <form method="post" th:action="@{'/posts/' + ${post.id} + '/rating'}" th:object="${ratingForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-2">
              <select class="form-select" th:field="*{value}">
                <option value="">Select</option>
                <option th:each="v : ${#numbers.sequence(1,5)}" th:value="${v}" th:text="${v}"></option>
              </select>
              <div class="text-danger small" th:if="${#fields.hasErrors('value')}" th:errors="*{value}"></div>
            </div>

            <button class="btn btn-primary" type="submit">Save rating</button>
          </form>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-6">
      <div class="card">
        <div class="card-body">
          <h5 class="card-title">Message author</h5>

          <form method="post" th:action="@{'/posts/' + ${post.id} + '/message'}" th:object="${messageForm}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="mb-2">
              <label class="form-label">Recipient</label>
              <select class="form-select" th:field="*{recipientId}">
                <option th:each="a : ${post.authors}" th:value="${a.id()}" th:text="${a.username()}"></option>
              </select>
              <div class="text-danger small" th:if="${#fields.hasErrors('recipientId')}" th:errors="*{recipientId}"></div>
            </div>

            <div class="mb-2">
              <label class="form-label">Message</label>
              <textarea class="form-control" rows="4" th:field="*{content}"></textarea>
              <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
            </div>

            <button class="btn btn-primary" type="submit">Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <h3 class="mb-3">Comments</h3>

  <div class="card mb-3">
    <div class="card-body">
      <form method="post" th:action="@{'/posts/' + ${post.id} + '/comments'}" th:object="${commentForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="mb-2">
          <textarea class="form-control" rows="3" th:field="*{content}" placeholder="Write a comment..."></textarea>
          <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
        </div>

        <button class="btn btn-primary" type="submit">Add comment</button>
      </form>
    </div>
  </div>

  <div class="list-group mb-3">
    <div class="list-group-item" th:each="c : ${comments.content}">
      <div class="d-flex justify-content-between">
        <strong th:text="${c.author().username()}"></strong>
        <small class="text-secondary" th:text="${#temporals.format(c.createdAt(), 'yyyy-MM-dd HH:mm')}"></small>
      </div>
      <div th:text="${c.content()}"></div>
    </div>
  </div>

  <nav class="d-flex justify-content-between mb-5">
    <a class="btn btn-outline-secondary"
       th:classappend="${comments.first} ? ' disabled' : ''"
       th:href="${comments.first} ? '#' : @{/posts/{id}(id=${post.id}, cpage=${comments.number - 1}, csize=${comments.size})}"
       th:attr="aria-disabled=${comments.first}, tabindex=${comments.first} ? -1 : 0">
      Prev
    </a>

    <a class="btn btn-outline-secondary"
       th:classappend="${comments.last} ? ' disabled' : ''"
       th:href="${comments.last} ? '#' : @{/posts/{id}(id=${post.id}, cpage=${comments.number + 1}, csize=${comments.size})}"
       th:attr="aria-disabled=${comments.last}, tabindex=${comments.last} ? -1 : 0">
      Next
    </a>
  </nav>
</main>
</body>
</html>
