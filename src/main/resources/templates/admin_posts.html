<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Posts</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Posts moderation</h1>
    <a class="btn btn-outline-secondary" href="/admin">CSV admin</a>
  </div>

  <form method="get" action="/admin/moderation/posts" class="row g-2 mb-3">
    <div class="col-12 col-md-5">
      <input class="form-control" type="text" name="text" placeholder="Search text..." th:value="${text}">
    </div>
    <div class="col-12 col-md-3">
      <input class="form-control" type="text" name="author" placeholder="Author username..." th:value="${author}">
    </div>
    <div class="col-12 col-md-2">
      <input class="form-control" type="number" name="size" th:value="${size}">
    </div>
    <div class="col-12 col-md-2">
      <button class="btn btn-primary w-100" type="submit">Search</button>
    </div>
  </form>

  <div class="list-group mb-4">
    <div class="list-group-item" th:each="p : ${posts.content}">
      <div class="d-flex justify-content-between align-items-start">
        <div class="me-3">
          <a class="fw-semibold text-decoration-none d-block" th:href="@{/posts/{id}(id=${p.id})}" th:text="${p.title}"></a>
          <div class="text-secondary small">
            <span th:each="a,iter : ${p.authors}" th:text="${a.username()} + (iter.last ? '' : ', ')"></span>
          </div>
          <div class="text-secondary small">
            <span>Avg rating: </span>
            <span th:text="${p.averageRating != null ? #numbers.formatDecimal(p.averageRating, 1, 2) : '-'}"></span>
          </div>
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/moderation/posts/{id}/edit(id=${p.id})}">Edit</a>

          <form method="post" th:action="@{/admin/moderation/posts/{id}/delete(id=${p.id})}" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <nav class="d-flex justify-content-between">
    <a class="btn btn-outline-secondary"
       th:classappend="${posts.first} ? ' disabled' : ''"
       th:href="${posts.first} ? '#' : @{/admin/moderation/posts(page=${posts.number - 1}, size=${posts.size}, text=${text}, author=${author})}"
       th:attr="aria-disabled=${posts.first}, tabindex=${posts.first} ? -1 : 0">
      Prev
    </a>

    <a class="btn btn-outline-secondary"
       th:classappend="${posts.last} ? ' disabled' : ''"
       th:href="${posts.last} ? '#' : @{/admin/moderation/posts(page=${posts.number + 1}, size=${posts.size}, text=${text}, author=${author})}"
       th:attr="aria-disabled=${posts.last}, tabindex=${posts.last} ? -1 : 0">
      Next
    </a>
  </nav>

  <div class="mt-4">
    <a class="btn btn-outline-secondary" href="/admin/moderation/users">Go to users moderation</a>
  </div>
</main>
</body>
</html>
