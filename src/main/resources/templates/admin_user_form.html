<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Edit user</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Edit user</h1>
    <a class="btn btn-outline-secondary" href="/admin/moderation/users">Back</a>
  </div>

  <div class="mb-3 text-secondary">
    <span>Username: </span><strong th:text="${username}"></strong>
  </div>

  <form method="post" th:action="@{/admin/moderation/users/{id}(id=${userId})}" th:object="${adminUserForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input class="form-control" type="email" th:field="*{email}">
      <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Role</label>
      <select class="form-select" th:field="*{role}">
        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
      </select>
      <div class="text-danger small" th:if="${#fields.hasErrors('role')}" th:errors="*{role}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Enabled</label>
      <select class="form-select" th:field="*{enabled}">
        <option th:value="true">true</option>
        <option th:value="false">false</option>
      </select>
      <div class="text-danger small" th:if="${#fields.hasErrors('enabled')}" th:errors="*{enabled}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">New password (optional)</label>
      <input class="form-control" type="text" th:field="*{password}">
      <div class="text-danger small" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>

    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</main>
</body>
</html>
