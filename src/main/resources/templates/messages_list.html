<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Messages</h1>
    <a class="btn btn-primary" href="/messages/new">New message</a>
  </div>

  <div class="d-flex gap-2 mb-3">
    <a class="btn btn-outline-secondary" th:classappend="${tab == 'inbox'} ? ' active' : ''" href="/messages/inbox">Inbox</a>
    <a class="btn btn-outline-secondary" th:classappend="${tab == 'sent'} ? ' active' : ''" href="/messages/sent">Sent</a>
  </div>

  <div class="list-group mb-4">
    <div class="list-group-item" th:each="m : ${messages.content}">
      <div class="d-flex justify-content-between align-items-start">
        <div class="me-3">
          <div class="text-secondary small" th:if="${tab == 'inbox'}">
            <span>From: </span>
            <a th:href="@{/messages/with/{id}(id=${m.sender().id()})}" th:text="${m.sender().username()}"></a>
          </div>

          <div class="text-secondary small" th:if="${tab == 'sent'}">
            <span>To: </span>
            <a th:href="@{/messages/with/{id}(id=${m.recipient().id()})}" th:text="${m.recipient().username()}"></a>
          </div>

          <div class="mt-1" th:text="${m.content()}"></div>
          <div class="text-secondary small" th:text="${#temporals.format(m.createdAt(), 'yyyy-MM-dd HH:mm')}"></div>
        </div>

        <form method="post" th:action="@{/messages/{id}/delete(id=${m.id()})}" class="m-0">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="back" th:value="${tab}">
          <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
        </form>
      </div>
    </div>
  </div>

  <nav class="d-flex justify-content-between">
    <a class="btn btn-outline-secondary"
       th:classappend="${messages.first} ? ' disabled' : ''"
       th:href="${messages.first} ? '#' : @{/messages/{t}(t=${tab}, page=${messages.number - 1}, size=${messages.size})}"
       th:attr="aria-disabled=${messages.first}, tabindex=${messages.first} ? -1 : 0">
      Prev
    </a>

    <a class="btn btn-outline-secondary"
       th:classappend="${messages.last} ? ' disabled' : ''"
       th:href="${messages.last} ? '#' : @{/messages/{t}(t=${tab}, page=${messages.number + 1}, size=${messages.size})}"
       th:attr="aria-disabled=${messages.last}, tabindex=${messages.last} ? -1 : 0">
      Next
    </a>
  </nav>
</main>
</body>
</html>
