<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Edit post</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Edit post</h1>
    <a class="btn btn-outline-secondary" href="/admin/moderation/posts">Back</a>
  </div>

  <form method="post" th:action="@{/admin/moderation/posts/{id}(id=${postId})}" th:object="${postForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="mb-3">
      <label class="form-label">Title</label>
      <input class="form-control" type="text" th:field="*{title}">
      <div class="text-danger small" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Content (HTML allowed)</label>
      <textarea class="form-control" rows="10" th:field="*{content}"></textarea>
      <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Authors</label>
      <select class="form-select" multiple size="10" th:field="*{authorIds}">
        <option th:each="u : ${users}" th:value="${u.id()}" th:text="${u.username()}"></option>
      </select>
      <div class="text-danger small" th:if="${#fields.hasErrors('authorIds')}" th:errors="*{authorIds}"></div>
    </div>

    <button class="btn btn-primary" type="submit">Save</button>
  </form>
</main>
</body>
</html>
