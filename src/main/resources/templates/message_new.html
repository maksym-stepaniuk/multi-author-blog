<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>New message</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">New message</h1>
    <a class="btn btn-outline-secondary" href="/messages/inbox">Back</a>
  </div>

  <form method="post" action="/messages" th:object="${messageForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

    <div class="mb-3">
      <label class="form-label">Recipient</label>
      <select class="form-select" th:field="*{recipientId}">
        <option value="">Select</option>
        <option th:each="u : ${users}" th:value="${u.id()}" th:text="${u.username()}"></option>
      </select>
      <div class="text-danger small" th:if="${#fields.hasErrors('recipientId')}" th:errors="*{recipientId}"></div>
    </div>

    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea class="form-control" rows="6" th:field="*{content}"></textarea>
      <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
    </div>

    <button class="btn btn-primary" type="submit">Send</button>
  </form>
</main>
</body>
</html>
