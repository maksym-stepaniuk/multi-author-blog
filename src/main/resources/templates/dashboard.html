<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">My posts</h1>
    <a class="btn btn-primary" href="/dashboard/posts/new">New post</a>
  </div>

  <div class="list-group mb-4">
    <div class="list-group-item" th:each="p : ${posts.content}">
      <div class="d-flex justify-content-between align-items-start">
        <div class="me-3">
          <a class="h5 d-block mb-1 text-decoration-none" th:href="@{'/posts/' + ${p.id}}" th:text="${p.title}"></a>
          <div class="text-secondary small">
            <span th:each="a,iter : ${p.authors}" th:text="${a.username()} + (iter.last ? '' : ', ')"></span>
          </div>
          <div class="text-secondary small">
            <span>Avg rating: </span>
            <span th:text="${p.averageRating != null ? #numbers.formatDecimal(p.averageRating, 1, 2) : '-'}"></span>
          </div>
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{'/dashboard/posts/' + ${p.id} + '/edit'}">Edit</a>

          <form method="post" th:action="@{'/dashboard/posts/' + ${p.id} + '/delete'}" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <nav class="d-flex justify-content-between">
    <a class="btn btn-outline-secondary"
       th:classappend="${posts.first} ? ' disabled' : ''"
       th:href="${posts.first} ? '#' : @{/dashboard(page=${posts.number - 1}, size=${posts.size})}"
       th:attr="aria-disabled=${posts.first}, tabindex=${posts.first} ? -1 : 0">
      Prev
    </a>

    <a class="btn btn-outline-secondary"
       th:classappend="${posts.last} ? ' disabled' : ''"
       th:href="${posts.last} ? '#' : @{/dashboard(page=${posts.number + 1}, size=${posts.size})}"
       th:attr="aria-disabled=${posts.last}, tabindex=${posts.last} ? -1 : 0">
      Next
    </a>
  </nav>
</main>
</body>
</html>
