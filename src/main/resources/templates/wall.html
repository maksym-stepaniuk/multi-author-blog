<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="row g-3 align-items-end mb-3">
    <div class="col-12 col-md-6">
      <label class="form-label">Search text</label>
      <input form="searchForm" class="form-control" type="text" name="text" th:value="${text}">
    </div>
    <div class="col-12 col-md-4">
      <label class="form-label">Author username</label>
      <input form="searchForm" class="form-control" type="text" name="author" th:value="${author}">
    </div>
    <div class="col-12 col-md-2">
      <form id="searchForm" method="get" action="/">
        <input type="hidden" name="size" th:value="${size}">
        <button class="btn btn-primary w-100" type="submit">Search</button>
      </form>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-2">
    <div class="text-secondary" th:text="'Total: ' + ${posts.totalElements}"></div>
    <div class="text-secondary" th:text="'Page: ' + (${posts.number} + 1) + '/' + ${posts.totalPages == 0 ? 1 : posts.totalPages}"></div>
  </div>

  <div class="list-group mb-4">
    <a class="list-group-item list-group-item-action" th:each="p : ${posts.content}" th:href="@{'/posts/' + ${p.id}}">
      <div class="d-flex w-100 justify-content-between">
        <h5 class="mb-1" th:text="${p.title}"></h5>
        <small class="text-secondary" th:text="${#temporals.format(p.createdAt, 'yyyy-MM-dd HH:mm')}"></small>
      </div>

      <div class="mb-1 text-secondary">
        <span>Authors: </span>
        <span th:each="a,iter : ${p.authors}" th:text="${a.username()} + (iter.last ? '' : ', ')"></span>
      </div>

      <div class="text-secondary">
        <span>Avg rating: </span>
        <span th:text="${p.averageRating != null ? #numbers.formatDecimal(p.averageRating, 1, 2) : '-'}"></span>
      </div>
    </a>
  </div>

  <nav class="d-flex justify-content-between">
    <a class="btn btn-outline-secondary"
       th:classappend="${posts.first} ? ' disabled' : ''"
       th:href="@{/(page=${posts.number - 1}, size=${posts.size}, text=${text}, author=${author})}">
      Prev
    </a>

    <a class="btn btn-outline-secondary"
       th:classappend="${posts.last} ? ' disabled' : ''"
       th:href="@{/(page=${posts.number + 1}, size=${posts.size}, text=${text}, author=${author})}">
      Next
    </a>
  </nav>
</main>
</body>
</html>
