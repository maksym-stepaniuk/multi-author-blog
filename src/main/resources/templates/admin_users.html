<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Users moderation</h1>
    <a class="btn btn-outline-secondary" href="/admin">CSV admin</a>
  </div>

  <form method="get" action="/admin/moderation/users" class="row g-2 mb-3">
    <div class="col-12 col-md-8">
      <input class="form-control" type="text" name="q" placeholder="Search username..." th:value="${q}">
    </div>
    <div class="col-12 col-md-2">
      <input class="form-control" type="number" name="size" th:value="${size}">
    </div>
    <div class="col-12 col-md-2">
      <button class="btn btn-primary w-100" type="submit">Search</button>
    </div>
  </form>

  <div class="list-group mb-4">
    <div class="list-group-item" th:each="u : ${users.content}">
      <div class="d-flex justify-content-between align-items-start">
        <div class="me-3">
          <div class="fw-semibold" th:text="${u.username()}"></div>
          <div class="text-secondary small" th:text="${u.email()}"></div>
          <div class="text-secondary small">
            <span th:text="${u.role()}"></span>
            <span th:text="${u.enabled()} ? ' | enabled' : ' | disabled'"></span>
          </div>
        </div>

        <div class="d-flex gap-2">
          <a class="btn btn-outline-secondary btn-sm" th:href="@{/admin/moderation/users/{id}/edit(id=${u.id()})}">Edit</a>

          <form method="post" th:action="@{/admin/moderation/users/{id}/delete(id=${u.id()})}" class="m-0">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button class="btn btn-outline-danger btn-sm" type="submit">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <nav class="d-flex justify-content-between">
    <a class="btn btn-outline-secondary"
       th:classappend="${users.first} ? ' disabled' : ''"
       th:href="${users.first} ? '#' : @{/admin/moderation/users(page=${users.number - 1}, size=${users.size}, q=${q})}"
       th:attr="aria-disabled=${users.first}, tabindex=${users.first} ? -1 : 0">
      Prev
    </a>

    <a class="btn btn-outline-secondary"
       th:classappend="${users.last} ? ' disabled' : ''"
       th:href="${users.last} ? '#' : @{/admin/moderation/users(page=${users.number + 1}, size=${users.size}, q=${q})}"
       th:attr="aria-disabled=${users.last}, tabindex=${users.last} ? -1 : 0">
      Next
    </a>
  </nav>

  <div class="mt-4">
    <a class="btn btn-outline-secondary" href="/admin/moderation/posts">Go to posts moderation</a>
  </div>
</main>
</body>
</html>
