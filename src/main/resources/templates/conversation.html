<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Conversation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h1 class="m-0">Conversation</h1>
    <a class="btn btn-outline-secondary" href="/messages/inbox">Back</a>
  </div>

  <div class="card mb-3">
    <div class="card-body" style="max-height: 55vh; overflow:auto;">
      <div th:each="m : ${chat.content}" class="mb-3">
        <div class="small text-secondary"
             th:text="${#temporals.format(m.createdAt(), 'yyyy-MM-dd HH:mm')}"></div>

        <div th:if="${m.senderId() == meId}" class="d-flex justify-content-end">
          <div class="border rounded p-2" style="max-width: 75%;">
            <div class="small text-secondary">You</div>
            <div th:text="${m.content()}"></div>
          </div>
        </div>

        <div th:if="${m.senderId() != meId}" class="d-flex justify-content-start">
          <div class="border rounded p-2" style="max-width: 75%;">
            <div class="small text-secondary" th:text="${m.senderUsername()}"></div>
            <div th:text="${m.content()}"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <form method="post" th:action="@{/messages/with/{id}(id=${otherUserId})}" th:object="${messageForm}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <input type="hidden" th:field="*{recipientId}">

    <div class="mb-2">
      <textarea class="form-control" rows="3" th:field="*{content}" placeholder="Write a message..."></textarea>
      <div class="text-danger small" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
    </div>

    <button class="btn btn-primary" type="submit">Send</button>
  </form>

  <nav class="d-flex justify-content-between mt-4 mb-5">
    <a class="btn btn-outline-secondary"
       th:classappend="${chat.first} ? ' disabled' : ''"
       th:href="${chat.first} ? '#' : @{/messages/with/{id}(id=${otherUserId}, page=${chat.number - 1}, size=${chat.size})}"
       th:attr="aria-disabled=${chat.first}, tabindex=${chat.first} ? -1 : 0">
      Prev
    </a>

    <a class="btn btn-outline-secondary"
       th:classappend="${chat.last} ? ' disabled' : ''"
       th:href="${chat.last} ? '#' : @{/messages/with/{id}(id=${otherUserId}, page=${chat.number + 1}, size=${chat.size})}"
       th:attr="aria-disabled=${chat.last}, tabindex=${chat.last} ? -1 : 0">
      Next
    </a>
  </nav>
</main>
</body>
</html>
